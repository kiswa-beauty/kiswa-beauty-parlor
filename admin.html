<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiswa Beauty Parlor - Owner Panel</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#fff8fa;color:#33242b;font:15px system-ui}header{background:#78304f;color:white;text-align:center;padding:18px}main{max-width:950px;margin:20px auto;padding:0 12px}.panel{background:white;border:1px solid #ead9df;border-radius:14px;padding:17px;margin-bottom:15px}h2{color:#78304f}label{display:block;margin:10px 0 5px}input,textarea,select{width:100%;padding:11px;border:1px solid #ead9df;border-radius:8px;font:inherit}button{background:#78304f;color:white;border:0;border-radius:22px;padding:10px 15px;margin:5px;cursor:pointer}.alt{background:#f8e9ee;color:#78304f}.danger{background:#9e3447}.hidden{display:none}.tabs{display:flex;flex-wrap:wrap;gap:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.item{border:1px solid #ead9df;border-radius:11px;padding:12px;margin-top:10px}.item img{width:100%;height:140px;object-fit:cover}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.note{font-size:13px;color:#796b71;line-height:1.7}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><header><h1>Kiswa Beauty Parlor</h1>مالک کا انتظامی پینل</header><main>
<section class="panel" id="login"><h2>مالک لاگ اِن</h2><label>Gmail / Email</label><input id="email" type="email" autocomplete="username"><label>پاس ورڈ</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">لاگ اِن</button><p id="loginMsg" class="note"></p></section>
<section class="panel hidden" id="dash"><button id="logout" class="alt">لاگ آؤٹ</button><div class="tabs"><button data-tab="appointments">اپائنٹمنٹس</button><button data-tab="products">پروڈکٹس</button><button data-tab="services">سروسز</button></div><p id="msg" class="note"></p>
<div id="appointments"><h2>اپائنٹمنٹس</h2><div id="alist"></div></div>
<div id="products" class="hidden"><h2>پروڈکٹ شامل / تبدیل کریں</h2><form id="pf"><input id="pid" type="hidden"><label>نام</label><input id="pn" required><div class="row"><div><label>قیمت (PKR)</label><input id="pp" type="number" min="0" required></div><div><label>تصویر (موبائل گیلری)</label><input id="pi" type="file" accept="image/*"></div></div><label>تفصیل</label><textarea id="pd"></textarea><label><input id="pa" type="checkbox" checked style="width:auto"> ویب سائٹ پر دکھائیں</label><button>محفوظ کریں</button><button type="button" class="alt" onclick="resetP()">نیا فارم</button></form><div id="plist"></div></div>
<div id="services" class="hidden"><h2>سروس شامل / تبدیل کریں</h2><form id="sf"><input id="sid" type="hidden"><label>سروس کا نام</label><input id="sn" required><label>قیمت (PKR)</label><input id="sp" type="number" min="0" required><label>تفصیل</label><textarea id="sd"></textarea><label><input id="sa" type="checkbox" checked style="width:auto"> ویب سائٹ پر دکھائیں</label><button>محفوظ کریں</button><button type="button" class="alt" onclick="resetS()">نیا فارم</button></form><div id="slist"></div></div></section></main>
<script>
const U='https://eoetqloahvvejkvuwptm.supabase.co',K='sb_publishable_SuVuX66lkeu5up69XCffpw_Y-OMb7Tn',db=supabase.createClient(U,K),$=id=>document.getElementById(id);let oldImg='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(t){$('msg').textContent=t}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>['appointments','products','services'].forEach(x=>$(x).classList.toggle('hidden',x!==b.dataset.tab)));
async function loadA(){const {data,error}=await db.from('appointments').select('*').order('created_at',{ascending:false});if(error){$('alist').textContent='اپائنٹمنٹس نہیں کھل سکیں؛ ڈیٹابیس پالیسی چیک کریں۔';return}$('alist').innerHTML=(data||[]).length?data.map(a=>'<article class="item"><b>'+esc(a.customer_name)+'</b><p class="note">'+esc(a.phone)+' · '+esc(a.service_name)+'<br>'+esc(a.preferred_date)+' · '+esc(a.preferred_time)+'<br>'+esc(a.details||'')+'</p><select id="a'+esc(a.id)+'"><option value="pending">زیر التوا</option><option value="accepted">منظور</option><option value="rejected">مسترد</option></select><button onclick="saveA(\''+esc(a.id)+'\')">حالت محفوظ کریں</button></article>').join(''):'ابھی کوئی اپائنٹمنٹ نہیں۔';(data||[]).forEach(a=>{if($('a'+a.id))$('a'+a.id).value=a.status})}
window.saveA=async id=>{const {error}=await db.from('appointments').update({status:$('a'+id).value}).eq('id',id);say(error?'اپ ڈیٹ ناکام؛ UPDATE policy چیک کریں۔':'اپائنٹمنٹ اپ ڈیٹ ہو گئی۔');loadA()};
async function loadP(){const {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});if(error){$('plist').textContent='پروڈکٹس لوڈ نہیں ہوئیں؛ RLS/schema چیک کریں۔';return}$('plist').innerHTML=(data||[]).length?'<div class="grid">'+data.map(p=>'<article class="item">'+(p.image_url?'<img src="'+esc(p.image_url)+'">':'')+'<b>'+esc(p.name)+'</b><p class="note">'+esc(p.price)+' PKR · '+esc(p.description||'')+'</p><button onclick="editP(\''+esc(p.id)+'\')">تبدیل</button><button class="danger" onclick="delP(\''+esc(p.id)+'\')">حذف</button></article>').join('')+'</div>':'ابھی کوئی پروڈکٹ نہیں۔'}
window.editP=async id=>{const {data,error}=await db.from('products').select('*').eq('id',id).single();if(error)return say('پروڈکٹ نہیں کھلی۔');$('pid').value=data.id;$('pn').value=data.name;$('pp').value=data.price;$('pd').value=data.description||'';$('pa').checked=data.active!==false;oldImg=data.image_url||''};
window.resetP=()=>{$('pf').reset();$('pid').value='';oldImg='';$('pa').checked=true};
window.delP=async id=>{if(!confirm('پروڈکٹ حذف کریں؟'))return;const {error}=await db.from('products').delete().eq('id',id);say(error?'حذف ناکام۔':'پروڈکٹ حذف ہو گئی۔');loadP()};
$('pf').onsubmit=async e=>{e.preventDefault();const user=(await db.auth.getUser()).data.user;if(!user)return say('دوبارہ لاگ اِن کریں۔');let image=oldImg||null,f=$('pi').files[0];if(f){const ext=(f.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,''),path=user.id+'/'+Date.now()+'.'+ext,up=await db.storage.from('product-images').upload(path,f,{upsert:true,contentType:f.type});if(up.error)return say('تصویر اپلوڈ ناکام؛ Storage upload policy درکار ہے۔');image=db.storage.from('product-images').getPublicUrl(path).data.publicUrl}const row={owner_id:user.id,name:$('pn').value.trim(),price:Number($('pp').value),description:$('pd').value.trim(),image_url:image,active:$('pa').checked},id=$('pid').value,q=id?db.from('products').update(row).eq('id',id):db.from('products').insert(row),{error}=await q;if(error)return say('محفوظ نہیں ہوا؛ products RLS/schema چیک کریں۔');resetP();say('پروڈکٹ محفوظ ہو گئی۔');loadP()};
async function loadS(){const {data,error}=await db.from('services').select('*').order('created_at',{ascending:false});if(error){$('slist').textContent='سروسز لوڈ نہیں ہوئیں؛ RLS چیک کریں۔';return}$('slist').innerHTML=(data||[]).length?'<div class="grid">'+data.map(s=>'<article class="item"><b>'+esc(s.name)+'</b><p class="note">'+esc(s.price)+' PKR · '+esc(s.description||'')+'</p><button onclick="editS(\''+esc(s.id)+'\')">تبدیل</button><button class="danger" onclick="delS(\''+esc(s.id)+'\')">حذف</button></article>').join('')+'</div>':'ابھی کوئی سروس نہیں۔'}
window.editS=async id=>{const {data,error}=await db.from('services').select('*').eq('id',id).single();if(error)return say('سروس نہیں کھلی۔');$('sid').value=data.id;$('sn').value=data.name;$('sp').value=data.price;$('sd').value=data.description||'';$('sa').checked=data.active!==false};
window.resetS=()=>{$('sf').reset();$('sid').value='';$('sa').checked=true};
window.delS=async id=>{if(!confirm('سروس حذف کریں؟'))return;const {error}=await db.from('services').delete().eq('id',id);say(error?'حذف ناکام۔':'سروس حذف ہو گئی۔');loadS()};
$('sf').onsubmit=async e=>{e.preventDefault();const user=(await db.auth.getUser()).data.user;if(!user)return say('دوبارہ لاگ اِن کریں۔');const row={owner_id:user.id,name:$('sn').value.trim(),price:Number($('sp').value),description:$('sd').value.trim(),active:$('sa').checked},id=$('sid').value,q=id?db.from('services').update(row).eq('id',id):db.from('services').insert(row),{error}=await q;if(error)return say('محفوظ نہیں ہوا؛ services RLS چیک کریں۔');resetS();say('سروس محفوظ ہو گئی۔');loadS()};
async function all(){await Promise.all([loadA(),loadP(),loadS()])}
$('loginBtn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent='لاگ اِن ناکام؛ ای میل/پاس ورڈ یا مالک کا اکاؤنٹ چیک کریں۔';return}$('login').classList.add('hidden');$('dash').classList.remove('hidden');all()};
$('logout').onclick=async()=>{await db.auth.signOut();$('dash').classList.add('hidden');$('login').classList.remove('hidden')};
db.auth.getSession().then(({data})=>{if(data.session){$('login').classList.add('hidden');$('dash').classList.remove('hidden');all()}});
</script></body></html>
