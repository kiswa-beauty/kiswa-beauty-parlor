<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiswa Owner Registration</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff5f8;font-family:Arial,sans-serif;color:#402536;padding:18px}
main{width:min(100%,430px);background:white;border:1px solid #f1c9d8;border-radius:20px;padding:26px;box-shadow:0 12px 35px #7b36551a}
h1{margin:0 0 8px;color:#a13d68}p{line-height:1.5;color:#684b59}label{display:block;margin:16px 0 6px;font-weight:600}
input{width:100%;padding:13px;border:1px solid #d9b8c6;border-radius:10px;font-size:16px}
button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:10px;background:#a13d68;color:white;font-size:16px;font-weight:bold}
#msg{margin-top:14px;overflow-wrap:anywhere}
small{color:#765c68}
</style></head>
<body><main>
<h1>Kiswa Beauty Parlor</h1><h2>Owner registration</h2>
<p>This is a one-time private setup. Only the person who has the private activation code should use this page.</p>
<form id="f">
<label>Email address</label><input id="email" type="email" autocomplete="email" required>
<label>Create password (at least 10 characters)</label><input id="password" type="password" minlength="10" autocomplete="new-password" required>
<label>One-time activation code</label><input id="code" type="text" autocomplete="off" required>
<button id="submit" type="submit">Create owner account</button>
</form><div id="msg" role="status"></div>
<p><small>After successful registration, open <a href="./admin.html">Owner login</a>.</small></p>
</main>
<script>
const SUPABASE_URL="https://eoetqloahvvejkvuwptm.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_SuVuX66lkeu5up69XCffpw_Y-OMb7Tn";
document.getElementById("f").addEventListener("submit",async e=>{
 e.preventDefault();const b=document.getElementById("submit"),m=document.getElementById("msg");
 b.disabled=true;b.textContent="Please wait…";m.textContent="";
 try{
  const r=await fetch(SUPABASE_URL+"/functions/v1/owner-register-v2",{method:"POST",
   headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},
   body:JSON.stringify({email:document.getElementById("email").value,
    password:document.getElementById("password").value,
    activationCode:document.getElementById("code").value})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||"Registration failed");
  m.textContent="Account created. Now open Owner login and sign in.";
  document.getElementById("f").reset();
 }catch(err){m.textContent=err.message;}finally{b.disabled=false;b.textContent="Create owner account";}
});
</script></body></html>
